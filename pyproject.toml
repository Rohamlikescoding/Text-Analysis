    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[tool.fastapi]
entrypoint = "api.api:app"

[dependency-groups]
dev = [
    "click>=8.5.1",
    "python-multipart>=0.0.33",
]
